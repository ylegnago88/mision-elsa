<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Elsa.exe — Archivo de Amistad</title>
<style>
:root{--ink:#120d22;--violet:#332052;--violet2:#5d3b8c;--pink:#ff6bad;--pink2:#ffb5d6;--gold:#ffd76a;--cream:#fff4dc;--mint:#9df2d0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100b1b;color:var(--cream);font-family:"Courier New",monospace}
body{display:flex;justify-content:center;align-items:center;padding:14px;background:
radial-gradient(circle at 15% 15%,#39255c 0 2px,transparent 3px),
radial-gradient(circle at 70% 30%,#fff 0 1px,transparent 2px),
radial-gradient(circle at 35% 80%,#fff 0 1px,transparent 2px),#100b1b}
#app{width:min(960px,100%);min-height:680px;background:linear-gradient(#211635,#2b1a48);
border:7px solid #08060d;box-shadow:0 0 0 4px #8a62c0,12px 12px 0 #08060d;position:relative;overflow:hidden}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.08;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px 5px);z-index:50}
header{height:58px;background:#0c0913;border-bottom:4px solid #8a62c0;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-weight:bold}
.logo{color:var(--mint);font-size:clamp(12px,2vw,17px)}.stats{color:var(--gold)}
main{min-height:615px;padding:25px;display:flex;justify-content:center;align-items:center}.panel{width:min(820px,100%);text-align:center}
.title{font-size:clamp(30px,6vw,62px);line-height:.95;text-shadow:5px 5px 0 #ff3f8d,9px 9px 0 #09070e;margin:12px 0 25px}
h2{color:var(--mint);font-size:clamp(20px,4vw,34px);margin:8px 0 18px}p{font:18px/1.55 Arial,sans-serif}.small{font-size:13px;color:#c9b9d9}
button{font:700 16px "Courier New",monospace;border:4px solid #08060d;background:var(--gold);padding:13px 17px;margin:7px;box-shadow:5px 5px 0 #08060d;cursor:pointer;color:#160d22}
button:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 #08060d}button.pink{background:var(--pink)}button.mint{background:var(--mint)}
.card{background:#30204a;border:3px dashed var(--pink);padding:18px;margin:14px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{margin:0;background:#fff0fa;text-align:left}
#feedback{min-height:28px;color:var(--gold);font-weight:bold;margin:12px}.shake{animation:shake .25s linear 2}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.gallery{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.gallery img{width:29%;min-width:150px;height:190px;object-fit:cover;border:5px solid #fff;box-shadow:5px 5px 0 #09070e}
.heart{font-size:64px;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.12)}}
#gameCanvas{display:block;width:100%;max-width:760px;height:auto;background:#161022;border:5px solid #09070e;image-rendering:pixelated;margin:auto}
.hud{display:flex;justify-content:space-between;max-width:760px;margin:8px auto;color:var(--gold);font-weight:bold}
.secret{background:#fff0f7;color:#27162f;border:5px solid var(--pink);padding:22px;box-shadow:8px 8px 0 #08060d}.secret h2{color:#ff3f8d}
.progress{height:18px;background:#0a0710;border:3px solid #08060d;max-width:560px;margin:18px auto}.progress i{display:block;height:100%;background:var(--pink);width:0}
@media(max-width:650px){main{padding:16px;min-height:620px}.choices{grid-template-columns:1fr}.gallery img{width:44%;min-width:120px;height:150px}}
</style>
</head>

ctx.fillStyle='#d7b2ff';ctx.fillRect(player.x+17,player.y-12,3,28);
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function move(dir){if(!running)return;const s=18;if(dir==='left')player.x-=s;if(dir==='right')player.x+=s;if(dir==='up')player.y-=s;if(dir==='down')player.y+=s;
player.x=Math.max(25,Math.min(c.width-25,player.x));player.y=Math.max(50,Math.min(c.height-25,player.y));tick()}
function tick(){
heartObjs=heartObjs.filter(h=>{if(dist(player,h)<25){hearts++;document.getElementById('hearts').textContent=hearts;return false}return true});
zombies.forEach(z=>{z.x+=z.vx;z.y+=z.vy;if(z.x<25||z.x>c.width-25)z.vx*=-1;if(z.y<55||z.y>c.height-25)z.vy*=-1;
if(dist(player,z)<25){lost++;player.x=70;player.y=350;document.getElementById('zcount').textContent=lost}});
draw();if(hearts>=10){running=false;points(30);setTimeout(finalLevel,500)}}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')move('left');if(k==='arrowright'||k==='d')move('right');if(k==='arrowup'||k==='w')move('up');if(k==='arrowdown'||k==='s')move('down')});
draw();setInterval(()=>{if(running)tick()},80);
}
function finalLevel(){
panel.innerHTML=`<div class="heart">🏆</div><h2>¡MISIÓN COMPLETADA!</h2>
<p>Archivo desbloqueado. Puntuación: <b>${score}</b></p><div class="progress"><i style="width:100%"></i></div>
<div class="secret"><h2>Para Elsa 💗</h2>
<p>Hay personas que llegan a tu vida y se quedan porque sí. Tú eres una de ellas.</p>
<p>Gracias por ser tan amorosa conmigo, por escucharme sin juzgarme, por entenderme y por acompañarme siempre que te necesito, sin dudar.</p>
<p>Gracias por quererme de verdad, incluso con todos mis defectos. Sé que puedo confiar en ti y eso es algo que valoro muchísimo.</p>
<p>14 años después seguimos acumulando historias: Acapulco, los XV de Sara, los Bachalsalsas, Six Flags... y aquella gloriosa entrada VIP con nuestro legendario <b>“con permiso”</b>. 😂</p>
<p><b>No hice esto por una fecha especial. Lo hice porque te quiero.</b></p>
<p style="font-size:25px;color:#ff3f8d"><b>TE QUIERO MUCHÍSIMO, ELSA. ❤️</b></p>
<p>Gracias por cada detalle, por escucharme, por entenderme y por estar. Valoro muchísimo tenerte en mi vida.</p>
</div><p class="small">FIN DEL ARCHIVO // AMISTAD INDESTRUCTIBLE ✦</p>`;
}
start();
</script>
